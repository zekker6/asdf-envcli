name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  asdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install asdf dependencies
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4

      - name: Run plugin test
        run: asdf plugin test envcli . --asdf-tool-version latest

      - name: Run plugin add
        run: asdf plugin add envcli https://github.com/zekker6/asdf-envcli.git

      - name: Run install
        run: asdf install envcli latest